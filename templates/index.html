<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Player Scouting Similarity Report</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        background-color: #f4f7f6;
      }

      .container {
        text-align: center;
        background: white;
        padding: 40px;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      }

      input {
        padding: 10px 15px;
        font-size: 16px;
        border-radius: 5px;
        border: 1px solid #ccc;
        width: 250px;
      }

      .search-controls {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 12px;
        margin-top: 20px;
        margin-bottom: 10px;
      }

      #choice-input {
        width: 300px;
        padding: 12px 14px;
        font-size: 16px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        outline: none;
        box-sizing: border-box;
      }

      input::placeholder {
        text-align: center;
        align-items: center;
      }

      #choice-input:focus {
        border-color: #64748b;
      }

      .similar-count-container {
        display: block;
        margin: 0 0 10px 0;
      }

      #similar-count {
        padding: 11px 12px;
        font-size: 15px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        background: white;
        cursor: pointer;
        outline: none;
      }

      #similar-count:focus {
        border-color: #64748b;
      }

      #apply-button,
      #load-players-button {
        padding: 11px 20px;
        font-size: 15px;
        font-weight: 600;
        border: none;
        border-radius: 6px;
        background-color: #1f2937;
        color: white;
        cursor: pointer;
      }

      #apply-button:hover,
      #load-players-button:hover {
        background-color: #374151;
      }

      #similar-players {
        margin-top: 20px;
      }
      .comparison-container {
        display: grid;
        grid-template-columns: 1fr 2fr 1fr;
        gap: 20px;
        align-items: center;
        margin-top: 30px;
      }

      .player-card {
        background: white;
        padding: 20px;
        border-radius: 8px;
      }

      #graph img {
        width: 100%;
        max-width: 500px;
      }

      .stat-row {
        padding: 10px 0;
      }

      .player-link {
        background: none;
        border: none;
        padding: 5px 0;
        font-size: 16px;
        color: #1a5fb4;
        cursor: pointer;
        text-decoration: underline;
      }

      .player-link:hover {
        color: #0b3d91;
      }

      /* Player count section */
      .player-count-container {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
        margin-top: 20px;
        margin-bottom: 25px;
      }

      #player-count {
        width: 150px;
        padding: 11px 14px;
        font-size: 15px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        outline: none;
        box-sizing: border-box;
      }

      #player-count:focus {
        border-color: #64748b;
      }

      /* Dynamically generated player selection */
      #player-selection {
        margin-top: 25px;
        padding-top: 20px;
        border-top: 1px solid #e5e7eb;
      }

      #player-selection > p {
        margin-bottom: 10px;
      }

      /* Player search */
      .search-controls {
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 15px 0;
      }

      #choice-input {
        width: 300px;
        padding: 12px 14px;
        font-size: 16px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        outline: none;
        box-sizing: border-box;
      }

      #choice-input:focus {
        border-color: #64748b;
      }

      /* Similar player count */
      .similar-count-container {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        margin: 15px 0;
      }

      #similar-count {
        padding: 10px 12px;
        font-size: 15px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        background: white;
        cursor: pointer;
        outline: none;
      }

      #similar-count:focus {
        border-color: #64748b;
      }

      /* Buttons */
      #apply-button,
      #load-players-button {
        padding: 11px 20px;
        font-size: 15px;
        font-weight: 600;
        border: none;
        border-radius: 6px;
        background-color: #1f2937;
        color: white;
        cursor: pointer;
      }

      #apply-button:hover,
      #load-players-button:hover {
        background-color: #374151;
      }

      /* Similar players */
      #similar-players {
        margin-top: 25px;
      }

      #similar-players h3 {
        margin-bottom: 10px;
      }

      #similar-players ol {
        padding-left: 25px;
      }

      /* Player links */
      .player-link {
        background: none;
        border: none;
        padding: 5px 0;
        font-size: 16px;
        color: #1a5fb4;
        cursor: pointer;
        text-decoration: underline;
      }

      .player-link:hover {
        color: #0b3d91;
      }

      /* Comparison section */
      .comparison-container {
        display: grid;
        grid-template-columns: 1fr 2fr 1fr;
        gap: 20px;
        align-items: center;
        margin-top: 30px;
      }

      .player-card {
        background: white;
        padding: 20px;
        border-radius: 8px;
      }

      .stat-row {
        padding: 10px 0;
      }

      #graph img {
        width: 100%;
        max-width: 500px;
      }

      /* Heatmap link */
      a {
        display: inline-block;
        margin-top: 30px;
        color: #1a5fb4;
      }

      .player-count-section {
        margin-top: 25px;
      }

      .section-title {
        font-size: 18px;
        font-weight: 600;
        margin-bottom: 5px;
      }

      .section-description {
        font-size: 14px;
        color: #64748b;
        margin-top: 0;
      }

      .player-count-container {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
        margin-top: 15px;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>Player Scouting Similarity Report</h1>
      <div class="player-count-section">
        <p class="section-title">Number of players</p>
        <p class="section-description">
          Choose between 15 and 150 players for this report.
        </p>

        <div class="player-count-container">
          <input
            list="player-count-options"
            id="player-count"
            placeholder="Select number"
          />

          <datalist id="player-count-options">
            {% for i in range(15, 151) %}
            <option value="{{ i }}"></option>
            {% endfor %}
          </datalist>

          <button id="load-players-button">Load Players</button>
        </div>
      </div>

      <div id="player-selection"></div>

      <div id="similar-players"></div>

      <div class="comparison-container">
        <div id="player1-stats"></div>

        <div id="graph"></div>

        <div id="player2-stats"></div>
      </div>

      <div id="heatmap-link"></div>
    </div>

    <script>
      let numPlayers;
      document
        .getElementById("load-players-button")
        .addEventListener("click", loadPlayers);

      async function loadPlayers() {
        document.getElementById("player1-stats").innerHTML = "";
        document.getElementById("player2-stats").innerHTML = "";
        document.getElementById("graph").innerHTML = "";
        document.getElementById("player-selection").innerHTML = "";
        document.getElementById("similar-players").innerHTML = "";

        const input = document.getElementById("player-count");
        numPlayers = Number(input.value);

        if (
          !Number.isInteger(numPlayers) ||
          numPlayers < 15 ||
          numPlayers > 150
        ) {
          alert("Please enter a whole number between 15 and 150.");
          return;
        }

        const response = await fetch("/num-players", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            "num-players": numPlayers,
          }),
        });

        const data = await response.json();

        if (!response.ok) {
          alert(data.error || "Unable to load players.");
          return;
        }

        document.getElementById("heatmap-link").innerHTML = `
          <a
            href="/heatmap?num-players=${numPlayers}"
            target="_blank"
          >
            View Total Player Similarity Heat Map Here
          </a>
`;

        playerNames = data.player_names;
        renderPlayerSelection(playerNames);
      }

      function renderPlayerSelection(playerNames) {
        const container = document.getElementById("player-selection");

        container.innerHTML = `
    <p>Enter a player you want to find a replacement for:</p>

    <div class="search-controls">
      <input
        list="player-names"
        id="choice-input"
        placeholder="Eg. Thiago Kone"
      />

      <datalist id="player-names">
        ${playerNames
          .map((name) => `<option value="${name}"></option>`)
          .join("")}
      </datalist>
    </div>

    <div class="similar-count-container">
      <label for="similar-count">No of similar players:</label>

      <select id="similar-count">
        ${Array.from({ length: 10 }, (_, i) => {
          const num = i + 1;
          return `
              <option value="${num}" ${num === 3 ? "selected" : ""}>
                ${num}
              </option>
            `;
        }).join("")}
      </select>
    </div>

    <button id="apply-button">Apply</button>
  `;

        // Add the event listener after creating the button
        document
          .getElementById("apply-button")
          .addEventListener("click", getSimilarPlayers);
      }

      async function getSimilarPlayers() {
        const playerName = document.getElementById("choice-input").value;

        const num = Number(document.getElementById("similar-count").value);

        if (!playerName) {
          return;
        }

        if (!playerNames.includes(playerName)) {
          alert("Please select a valid player from the list.");
          return;
        }

        const response = await fetch("/similar-players", {
          method: "POST",

          headers: {
            "Content-Type": "application/json",
          },

          body: JSON.stringify({
            player: playerName,
            num: num,
            "num-players": numPlayers,
          }),
        });

        const data = await response.json();

        displaySimilarPlayers(playerName, data.similar_players);
      }

      function displaySimilarPlayers(playerName, players) {
        document.getElementById("player1-stats").innerHTML = "";
        document.getElementById("player2-stats").innerHTML = "";
        document.getElementById("graph").innerHTML = "";
        const resultDiv = document.getElementById("similar-players");

        resultDiv.innerHTML = "";

        const heading = document.createElement("h3");

        heading.innerText = `Most Similar Players to ${playerName}`;

        resultDiv.appendChild(heading);

        const list = document.createElement("ol");
        list.style.display = "inline-block";
        list.style.textAlign = "left";
        list.style.marginTop = "0";

        players.forEach((player) => {
          const listItem = document.createElement("li");

          const button = document.createElement("button");

          button.innerText = player;

          button.classList.add("player-link");

          button.onclick = function () {
            showStats(playerName, player);
          };

          listItem.appendChild(button);

          list.appendChild(listItem);
        });

        resultDiv.appendChild(list);
      }

      async function showStats(originalPlayer, selectedPlayer) {
        const response = await fetch("/compare", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            player1: originalPlayer,
            player2: selectedPlayer,
            "num-players": numPlayers,
          }),
        });

        const data = await response.json();

        displayComparison(
          originalPlayer,
          data.player1,
          selectedPlayer,
          data.player2,
          data.graph,
        );
      }

      function displayComparison(player1, stats1, player2, stats2, graph) {
        document.getElementById("player1-stats").innerHTML = createStatsCard(
          player1,
          stats1,
        );

        document.getElementById("player2-stats").innerHTML = createStatsCard(
          player2,
          stats2,
        );

        document.getElementById("graph").innerHTML = `
        <img 
            src="data:image/png;base64,${graph}"
            alt="Radar Chart"
        >
        `;
      }

      function createStatsCard(player, playerData) {
        const info = playerData.info;
        const stats = playerData.stats;

        const infoLabels = {
          age: "Age",
          position: "Position",
          league: "League",
          nationality: "Nationality",
          value: "Market Value (€M)",
        };

        const statLabels = {
          pace: "Pace",
          dribbling: "Dribbling",
          passing_accuracy: "Passing Accuracy",
          shooting: "Shooting",
          tackling: "Tackling",
          aerial_duels_won_pct: "Aerial Duels Won %",
          positioning: "Positioning",
          stamina: "Stamina",
          goals_per90: "Goals Per 90",
          assists_per90: "Assists Per 90",
        };

        return `
    <div class="player-card">

        <h2>${player}</h2>

        <div class="player-info">

            ${Object.keys(info)
              .map(
                (item) => `
                    <p>
                        <strong>${infoLabels[item]}</strong>:
                        ${info[item]}
                    </p>
                    `,
              )
              .join("")}
        </div>
        <hr>
        <div class="player-stats">
            ${Object.keys(stats)
              .map(
                (stat) => `
                    <div class="stat-row">
                        <span>${statLabels[stat]}</span>:
                        <strong>${stats[stat]}</strong>
                    </div>
                    `,
              )
              .join("")}
        </div>
    </div>
    `;
      }
    </script>
  </body>
</html>
