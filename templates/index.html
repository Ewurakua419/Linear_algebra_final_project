<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Player Scouting Similarity Report</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        background-color: #f4f7f6;
      }

      .container {
        text-align: center;
        background: white;
        padding: 40px;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      }

      input {
        padding: 10px 15px;
        font-size: 16px;
        border-radius: 5px;
        border: 1px solid #ccc;
        width: 250px;
      }

      #similar-players {
        margin-top: 20px;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>Player Scouting Similarity Report</h1>

      <p>Enter a player you want to find a replacement for:</p>

      <input
        list="player-names"
        id="choice-input"
        placeholder="Eg. Thiago Kone"
      />

      <datalist id="player-names">
        {% for name in player_names %}
        <option value="{{ name }}"></option>
        {% endfor %}
      </datalist>

      <div id="similar-players"></div>
    </div>

    <script>
      const playerInput = document.getElementById("choice-input");
      const resultDiv = document.getElementById("similar-players");

      playerInput.addEventListener("change", async function () {
        const playerName = playerInput.value;

        if (!playerName) {
          return;
        }

        const response = await fetch("/process", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            text: playerName,
          }),
        });

        const data = await response.json();

        resultDiv.innerHTML = "";

        if (data.similar_players) {
          const title = document.createElement("h3");
          title.innerText = `Players similar to ${playerName}:`;

          resultDiv.appendChild(title);

          const list = document.createElement("ul");

          data.similar_players.forEach((player) => {
            const item = document.createElement("li");
            item.innerText = player;

            list.appendChild(item);
          });

          resultDiv.appendChild(list);
        } else {
          resultDiv.innerText = data.error;
        }
      });
    </script>
  </body>
</html>
