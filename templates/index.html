<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Player Scouting Similarity Report</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        background-color: #f4f7f6;
      }

      .container {
        text-align: center;
        background: white;
        padding: 40px;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      }

      input {
        padding: 10px 15px;
        font-size: 16px;
        border-radius: 5px;
        border: 1px solid #ccc;
        width: 250px;
      }

      #similar-players {
        margin-top: 20px;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>Player Scouting Similarity Report</h1>

      <p>Enter a player you want to find a replacement for:</p>

      <input
        list="player-names"
        id="choice-input"
        placeholder="Eg. Thiago Kone"
      />

      <datalist id="player-names">
        {% for name in player_names %}
        <option value="{{ name }}"></option>
        {% endfor %}
      </datalist>

      <div id="similar-players"></div>

      <div id="comparison"></div>
    </div>

    <script>
      const playerInput = document.getElementById("choice-input");
      const resultDiv = document.getElementById("similar-players");

      playerInput.addEventListener("change", async function () {
        const playerName = playerInput.value;

        if (!playerName) {
          return;
        }

        const response = await fetch("/similar-players", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            text: playerName,
          }),
        });

        const data = await response.json();

        resultDiv.innerHTML = "";

        if (data.similar_players) {
          resultDiv.innerHTML = "";

          data.similar_players.forEach((player) => {
            const button = document.createElement("button");

            button.innerText = player;

            button.onclick = function () {
              showStats(playerName, player);
            };

            resultDiv.appendChild(button);
          });
        } else {
          resultDiv.innerText = data.error;
        }
      });

      async function showStats(originalPlayer, selectedPlayer) {
        const response = await fetch("/stats", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            player: selectedPlayer,
          }),
        });

        const selectedStats = await response.json();

        const originalResponse = await fetch("/stats", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            player: originalPlayer,
          }),
        });

        const originalStats = await originalResponse.json();

        displayComparison(
          originalPlayer,
          originalStats,
          selectedPlayer,
          selectedStats,
        );
      }

      function displayComparison(player1, stats1, player2, stats2) {
        const comparison = document.getElementById("comparison");

        comparison.innerHTML = `
        <h2>Player Comparison</h2>

        <table border="1">

            <tr>
                <th>Stat</th>
                <th>${player1}</th>
                <th>${player2}</th>
            </tr>

            ${Object.keys(stats1)
              .map(
                (stat) => `
                <tr>
                    <td>${stat}</td>
                    <td>${stats1[stat]}</td>
                    <td>${stats2[stat]}</td>
                </tr>
            `,
              )
              .join("")}

        </table>
    `;
      }
    </script>
  </body>
</html>
